name: Intraday Stock Monitor

on:
  schedule:
    # 週一至週五，UTC 01:00 至 05:30（對應台灣時間 09:00~13:30），每 15 分鐘執行一次
    - cron: '*/15 1-5 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊執行測試

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予此工作流程對儲存庫的寫入權限，解決 403 錯誤

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行盤中訊號檢查
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "import swing_monitor; swing_monitor.check_intraday_signals()"

      - name: 將最新資料庫紀錄存回 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 檢查是否有資料庫變更需要提交
          if [ -f trading_journal.db ]; then
            git add trading_journal.db
            if git diff --staged --quiet; then
              echo "無資料庫異動，略過提交。"
            else
              git commit -m "Auto-update trading journal [skip ci]"
              # 先 pull 避免並發或多排程衝突，再推送到儲存庫
              git pull --rebase origin main || true
              git push origin main
            fi
          fi
